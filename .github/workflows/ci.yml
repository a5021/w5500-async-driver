name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache apt packages (gcc)
        # Host GCC comes from the Ubuntu archives on every run; cache the
        # .debs so a stalled archive download cannot hang the job with no
        # output (seen on fuzz/clang). Self-healing: a refreshed archive
        # simply re-downloads once and re-saves.
        uses: actions/cache@v5
        with:
          path: ~/apt-debs
          key: ${{ runner.os }}-apt-gcc-v1
      - name: Install host GCC
        # The ubuntu-latest image ships a Google Chrome apt source (as a
        # .list or deb822 .sources file) whose metadata occasionally gets a
        # Hash Sum mismatch on the CDN, failing apt-get update for every
        # package install. Drop whatever file references it first — our tools
        # come from the Ubuntu archives only.
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          # The Azure-local mirror intermittently stalls apt-get update with
          # endless Ign retries (hung a job 14+ min with no output) while the
          # canonical archive answers. Repoint, don't delete: same content.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update && break || sleep 15; done
          sudo apt-get install -y gcc
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: Build and run the unit tests
        run: make test

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache apt packages (clang)
        # See host-tests: cached .debs keep a stalled archive from hanging
        # the job with no output (this job hung 27+ min on install once).
        uses: actions/cache@v5
        with:
          path: ~/apt-debs
          key: ${{ runner.os }}-apt-clang-v1
      - name: Install clang
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          # See host-tests: the Azure mirror stalls apt-get update — repoint.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update && break || sleep 15; done
          sudo apt-get install -y clang
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: Cache fuzz corpus
        # Carry the coverage-grown corpus between runs: a fresh key per commit
        # saves a new snapshot, the restore-key prefix pulls the latest one.
        uses: actions/cache@v5
        with:
          path: build/fuzz/corpus
          key: ${{ runner.os }}-fuzz-corpus-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-
      - name: Build and run fuzz harnesses (libFuzzer)
        # Short FUZZ_TIME: this is a regression gate over the cached corpus,
        # not a marathon. Longer campaigns run locally or on a schedule.
        run: make FUZZ_CC=clang FUZZ_TIME=5 fuzz-all
