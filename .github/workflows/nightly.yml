name: Nightly fuzz

# Long campaigns are too slow for the pull-request gate, so they run once a
# day (or on demand) over the same corpus the fast CI job keeps warm.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz-deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache apt packages (clang)
        uses: actions/cache@v5
        with:
          path: ~/apt-debs
          key: ${{ runner.os }}-apt-clang-v1
      - name: Install clang
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          sudo grep -rl 'dl.google.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update && break || sleep 15; done
          sudo apt-get install -y clang
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: Cache fuzz corpus
        uses: actions/cache@v5
        with:
          path: build/fuzz/corpus
          key: ${{ runner.os }}-fuzz-corpus-nightly-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fuzz-corpus-
      - name: Deep fuzz campaign (300 s per harness)
        run: make FUZZ_CC=clang FUZZ_TIME=300 fuzz-all
      - name: Upload grown corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: build/fuzz/corpus
          retention-days: 14
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            build/fuzz/corpus/**/crash-*
          retention-days: 30
